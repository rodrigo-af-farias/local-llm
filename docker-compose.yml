services:

  ollama:
    image: ${OLLAMA_IMAGE}
    container_name: local-llm-ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    image: local-llm-web
    container_name: local-llm-web
    ports:
      - "3000:80"
    depends_on:
      - ollama
    restart: unless-stopped