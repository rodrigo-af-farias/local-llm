name: Build and Publish LLM

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        model:
          - qwen3-4b

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read model configuration
        id: config
        run: |
          CONFIG_FILE="models/${{ matrix.model }}/config.env"

          MODEL=$(grep '^MODEL=' "$CONFIG_FILE" | cut -d '=' -f2-)
          IMAGE_NAME=$(grep '^IMAGE_NAME=' "$CONFIG_FILE" | cut -d '=' -f2-)

          echo "model=$MODEL" >> "$GITHUB_OUTPUT"
          echo "image_name=$IMAGE_NAME" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./docker
          file: ./docker/Dockerfile
          push: true
          build-args: |
            MODEL=${{ steps.config.outputs.model }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ steps.config.outputs.image_name }}:latest