name: PR Review Notice

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review-status:
    runs-on: ubuntu-latest

    steps:
      - name: Native Copilot review check
        run: |
          echo "GitHub Copilot PR review is not available as a public GitHub Action."
          echo "If this repository includes the native GitHub Copilot code review feature, it will appear directly in the PR UI."
          echo "This workflow exists only to avoid failing CI while the repository does not have a supported native Copilot review integration configured."
